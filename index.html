<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/stylelgn.css">
  <title>Login</title>
</head>
<body>
  <!-- Sign Up Form -->
  <form action="" id="form">
    <div class="container">
      <div class="form signup">
        <h2>Sign Up</h2>
        <div class="inputBox">
          <input type="text" id="tbxUsername" name="tbxUsername" required>
          <i class="fa-solid fa-user"></i>
          <span>Username</span>
        </div>
        <div class="inputBox">
          <input type="password"  id="tbxPassword" name="tbxPassword" required>
          <i class="fa-solid fa-lock"></i>
          <span>Create password</span>
        </div>
        <div class="eyes">
          <span class="icon-eye" id="showPassword"><i class="fa-sharp fa-solid fa-eye-slash"></i></span>
        </div>
        <div class="inputBox">
          <input type="password"  id="tbxConfirmPassword" name="tbxConfirmPassword" required>
          <i class="fa-solid fa-lock"></i>
          <span>Confirm password</span>
        </div>
        <div class="eyes">
          <span class="icon-eye" id="showConfirmPassword"><i class="fa-sharp fa-solid fa-eye-slash"></i></span>
        </div>
        <!-- ... Otros campos ... -->
        <div class="inputBox">
          <input type="submit" value="Create Account" name="btnGetInto">
          <p class="warnings" id="warnings"></p>
        </div>
        <p>Already a member? <a href="#" class="login">Log in</a></p>
      </div>
      <!-- Sign In Form -->
      <div class="form signin">
        <h2>Sign In</h2>
        <div class="inputBox">
          <input type="text" id="tbxUsernameId" name="tbxUsernameId" required>
          <i class="fa-solid fa-user"></i>
          <span>Username</span>
        </div>
        <div class="inputBox">
          <input type="password"  id="tbxPasswordId" name="tbxPasswordId" required>
          <i class="fa-solid fa-lock"></i>
          <span>Password</span>
        </div>
        <div class="eyes">
          <span class="icon-eye" id="showPasswordId"><i class="fa-sharp fa-solid fa-eye-slash"></i></span>
        </div>
        <!-- ... Otros campos ... -->
        <div class="inputBox">
          <input type="submit" value="Login" name="btnRegister">
        </div>
        <p>Not a member? <a href="#" class="create">Create an account</a></p>
      </div>
    </div>
  </form>
  <script src="js/script.js"></script>
</body>
</html>
